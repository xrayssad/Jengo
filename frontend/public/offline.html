<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#14231A" />
  <title>Jengo</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #14231A;
      color: #F2EDE4;
      font: 600 16px/1.4 Georgia, "Iowan Old Style", Palatino, serif;
      text-align: center;
      padding: 24px;
    }
    p { margin: 0; max-width: 260px; }
    button {
      min-width: 120px;
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      background: #F2EDE4;
      color: #14231A;
      font: 700 14px/1 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <svg viewBox="0 14 44 70" width="45" height="72" fill="none" stroke="#F2EDE4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M22 78C22 78 3 56 3 38A19 19 0 1 1 41 38C41 56 22 78 22 78Z" />
    <path d="M13 40L22 31L31 40V48H13Z" fill="#D4A95A" stroke="none" />
  </svg>
  <p id="msg">You are offline</p>
  <button type="button" id="retry">Retry</button>
  <script>
    (function () {
      var sw = false;
      try { sw = (document.documentElement.lang || navigator.language || "").toLowerCase().indexOf("sw") === 0; } catch (e) {}
      try { sw = localStorage.getItem("jengo_lang") === "sw" || sw; } catch (e) {}
      document.getElementById("msg").textContent = sw ? "Huna mtandao" : "You are offline";
      document.getElementById("retry").textContent = sw ? "Jaribu tena" : "Retry";
      document.getElementById("retry").addEventListener("click", function () { location.reload(); });
    })();
  </script>
</body>
</html>
